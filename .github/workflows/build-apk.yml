name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk dropper-copy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dropper-copy-apk
          path: dropper-copy.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dropper-copy.apk \
            --title "Dropper Copy (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}." \
            --target "$GITHUB_SHA" --prerelease
